<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="2026-10-02-kannada-navigation-fix">
<title>शिवमहापुराण</title>
<meta name="app-version" content="2026-10-02-hindi-menu-kannada-preserved"><link rel="stylesheet" href="styles.css?v=32">
</head>
<body data-lang="hi">
<header class="topbar">
<button id="menuBtn" class="icon-btn" aria-label="मेनू खोलें">☰</button>
<div class="brand"><div class="brand-mark">ॐ</div><div><div id="bookTitle" class="brand-title">शिवमहापुराण</div><div id="brandSubtitle" class="brand-subtitle">सरल डिजिटल पाठ</div></div></div>
<button id="fontBtn" class="font-btn">अ / अ+</button>
</header>

<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<div class="layout">
<aside id="sidebar" class="sidebar">
  <div class="mobile-menu-head">
    <strong id="mobileBookLabel">पुस्तक</strong>
    <button id="closeMenuBtn" class="close-menu-btn" aria-label="मेनू बंद करें">×</button>
  </div>
  <div id="bookLabel" class="side-heading desktop-side-heading">पुस्तक</div>
  <div class="book-card">📖 <strong>शिवमहापुराण</strong></div>
  <div id="chapterLabel" class="side-heading chapter-heading">अध्याय</div>
  <div id="chapterList"></div>
</aside>

<main class="content">
<div id="breadcrumbs" class="breadcrumbs">शिवमहापुराण › माहात्म्य</div>
<section class="chapter-header">
<div id="sectionLabel" class="eyebrow">माहात्म्य</div>
<h1 id="chapterTitle">अध्याय १</h1>
<p id="chapterDescription"></p>
</section>

<div class="toolbar">
  <label class="search">⌕ <input id="searchInput" type="search" placeholder="इस अध्याय में खोजें…"></label>
  <div class="reading-controls">
    <select id="languageSelect" class="language-select" aria-label="भाषा चुनें">
      <option value="hi">हिन्दी</option>
      <option value="kn">ಕನ್ನಡ</option>
    </select>
    <button id="tocBtn" class="small-btn">श्लोक आरम्भ</button>
  </div>
</div>

<div class="chapter-tools"><span id="verseCount"></span></div>
<div id="verseList"></div>

<nav class="chapter-pager" aria-label="अध्याय नेविगेशन"><button id="prevChapterBtn">← पिछला अध्याय</button><span id="pagerLabel">पूरा अध्याय एक ही पृष्ठ पर</span><button id="nextChapterBtn">अगला अध्याय →</button></nav>
<footer>ॐ नमः शिवाय</footer>
</main></div>
<script src="app.js?v=32"></script>
</body></html>
